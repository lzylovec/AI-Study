<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">AI Study</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>

<body>

    <nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
                <i class="fas fa-brain me-2"></i>AI Study
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${active == 'dashboard' ? 'active' : ''}"
                            th:href="@{/dashboard}">
                            <i class="fas fa-tachometer-alt me-1"></i> 控制台
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${active == 'notes' ? 'active' : ''}" th:href="@{/notes}">
                            <i class="fas fa-book me-1"></i> 笔记
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${active == 'graph' ? 'active' : ''}" th:href="@{/graph}">
                            <i class="fas fa-project-diagram me-1"></i> 知识图谱
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="doLogout()">
                            <i class="fas fa-sign-out-alt me-1"></i> 退出
                        </a>
                    </li>
                </ul>
            </div>
        </div>
        <script th:inline="javascript">
            async function doLogout() {
                try {
                    await fetch('api/auth/logout', { method: 'POST' });
                    location.href = './'; // Go back to login
                } catch (e) {
                    location.href = './';
                }
            }
        </script>
    </nav>

    <div th:fragment="loading">
        <div id="loading-overlay">
            <div class="spinner"></div>
        </div>
    </div>

    <div th:fragment="scripts">
        <!-- Bootstrap Bundle with Popper -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <!-- SweetAlert2 -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <!-- Marked.js for Markdown parsing -->
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

        <script th:inline="javascript">
            // Global Fetch Interceptor for Loading State
            const originalFetch = window.fetch;
            window.fetch = async function (...args) {
                const loader = document.getElementById('loading-overlay');
                if (loader) loader.style.display = 'flex';
                try {
                    const response = await originalFetch(...args);
                    return response;
                } catch (error) {
                    throw error;
                } finally {
                    if (loader) loader.style.display = 'none';
                }
            };

            // Common Toast
            const Toast = Swal.mixin({
                toast: true,
                position: 'top-end',
                showConfirmButton: false,
                timer: 3000,
                timerProgressBar: true
            });

            function showToast(icon, title) {
                Toast.fire({
                    icon: icon,
                    title: title
                });
            }
        </script>
    </div>

</body>

</html>
